name: Events data sync

# Accumulates event-snapshot history without a deployed server: runs the
# one-shot sync worker on a schedule against the shared Postgres database.
#
# Setup (repo Settings -> Secrets and variables -> Actions -> Secrets):
#   DATABASE_URL            required for recording (e.g. a Neon connection string)
#   TICKETMASTER_API_KEY    enables the Ticketmaster source (SF + Sacramento)
#   EVENTBRITE_API_TOKEN    optional, enables the merchant-offer sync
#
# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch — this
# workflow starts firing hourly once merged to main. Until then, run it
# manually from the Actions tab (workflow_dispatch works from any branch).

on:
  schedule:
    - cron: "23 * * * *" # hourly at :23 (off the top-of-hour rush)
  workflow_dispatch: {}

concurrency:
  group: events-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: events-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: events-mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run sync worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_API_TOKEN: ${{ secrets.EVENTBRITE_API_TOKEN }}
          EVENTS_JSONLD: "on"
          EVENTS_ICS: "on"
          EVENTS_FUNCHEAP: "on"
        run: node dist/sync.js
